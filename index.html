<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>小白团子 Companion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="stars-container"></div>
    <div id="orb-container"></div>
    
    <div class="top-ui">
        <!-- 左侧徽章 -->
        <div class="memory-badge" id="badge-ui">...</div>
        
        <!-- 右侧工具栏：已改为横向容器 -->
        <div class="right-tools">
            <div class="tool-container">
                <div class="tool-btn" onclick="toggleMenu('bag-menu')">🎒</div>
                <div id="bag-menu" class="pop-menu">
                    <a href="https://www.instagram.com/advicewithanson/" target="_blank" class="menu-item" style="color:#f43f5e; font-weight:bold;">✨ Anson 的小站</a>
                    <div class="menu-item" onclick="giveGift('🍪', '小饼干')">🍪 投喂饼干</div>
                    <div class="menu-item" onclick="giveGift('🍵', '热茶')">🍵 倒杯热茶</div>
                    <div class="menu-item" onclick="startFocus()">📖 陪我专注</div>
                    <div class="menu-item" onclick="exportDiary()">📥 导出日记</div>
                </div>
            </div>
            
            <div class="tool-container">
                <div class="tool-btn" onclick="toggleMenu('note-menu')">✉️</div>
                <div id="note-menu" class="pop-menu">
                    <div class="menu-item" onclick="giveNote()">✉️ 抽张纸条</div>
                </div>
            </div>
        </div>
    </div>

    <!-- 登录/注册界面 -->
    <div id="auth-screen" style="display: none; position: fixed; inset: 0; background: linear-gradient(180deg, #0f172a 0%, #1e293b 100%); z-index: 5000; flex-direction: column; justify-content: center; align-items: center;">
        <div style="text-align: center; margin-bottom: 40px;">
            <h2 style="color: white; font-weight: 300; margin-bottom: 10px;">小白团子</h2>
            <p style="color: #94a3b8; font-size: 0.9rem;">登录保存你的情绪日记</p>
        </div>
        
        <div id="login-form" style="display: flex; flex-direction: column; gap: 15px; width: 280px;">
            <input type="text" id="login-username" placeholder="用户名" style="padding: 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.1); color: white; outline: none;">
            <input type="password" id="login-password" placeholder="密码" style="padding: 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.1); color: white; outline: none;">
            <button onclick="handleLogin()" style="padding: 12px; border-radius: 12px; background: white; color: #0f172a; border: none; font-weight: bold; cursor: pointer;">登录</button>
            <button onclick="showRegister()" style="padding: 12px; border-radius: 12px; background: transparent; color: white; border: 1px solid rgba(255,255,255,0.3); cursor: pointer;">注册新账号</button>
            <button onclick="skipLogin()" style="padding: 8px; background: transparent; color: #64748b; border: none; cursor: pointer; font-size: 0.85rem;">跳过，离线使用</button>
        </div>
        
        <div id="register-form" style="display: none; flex-direction: column; gap: 15px; width: 280px;">
            <input type="text" id="register-username" placeholder="用户名" style="padding: 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.1); color: white; outline: none;">
            <input type="password" id="register-password" placeholder="密码" style="padding: 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.1); color: white; outline: none;">
            <input type="text" id="register-nickname" placeholder="昵称（可选）" style="padding: 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.1); color: white; outline: none;">
            <button onclick="handleRegister()" style="padding: 12px; border-radius: 12px; background: white; color: #0f172a; border: none; font-weight: bold; cursor: pointer;">注册</button>
            <button onclick="showLogin()" style="padding: 12px; border-radius: 12px; background: transparent; color: white; border: 1px solid rgba(255,255,255,0.3); cursor: pointer;">返回登录</button>
        </div>
    </div>

    <div id="onboarding">
        <h2 style="margin-bottom: 30px; font-weight: 300;">你好呀，我是小白团子。<br>我该怎么称呼你呢？</h2>
        <input type="text" id="name-input" class="input-box" placeholder="你的名字..." maxlength="8">
        <button class="action-btn" onclick="saveName()">我们要一直在一起哦</button>
    </div>

    <div class="main-stage">
        <div id="focus-timer">25:00</div>
        <div class="speech-bubble" id="bubble">...</div>

        <div id="express-area" class="input-container">
            <textarea id="express-input" class="input-box textarea" placeholder="想对团子说点什么吗？" rows="5"></textarea>
            <div class="image-preview" id="image-preview"></div>
            <div class="emotion-row">
                <button class="emo-btn happy" onclick="handleExpress('happy')">✨ 记录美好</button>
                <button class="emo-btn worry-blue" onclick="handleExpress('worry')">💧 消化烦恼</button>
                <label class="image-upload-btn-small" id="image-upload-label">
                    🖼️
                    <input type="file" id="image-input" accept="image/*" style="display: none;">
                </label>
            </div>
        </div>

        <div class="tilt-box" id="tilt-box">
            <div class="breath-wrap" id="breath-wrap">
                <div class="spirit" id="spirit">
                    <div class="face" id="face">
                        <div class="eyes">
                            <div class="eye"></div>
                            <div class="eye"></div>
                        </div>
                        <div class="blush-container">
                            <div class="blush"></div>
                            <div class="blush"></div>
                        </div>
                        <div class="mouth" id="mouth">
                            <div class="tongue"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <button id="exit-focus" class="action-btn" style="margin-top: 30px; display: none;" onclick="stopFocus()">不学啦，抱抱我</button>
    </div>

    <div class="dock" id="main-dock">
        <div class="dock-item active" onclick="switchMode('idle', this)">🏠</div>
        <div class="dock-item" onclick="switchMode('express', this)">✉️</div>
        <div class="dock-item" onclick="switchMode('breath', this)">🌬️</div>
        <div class="dock-item" onclick="switchMode('sleep', this)">🌙</div>
    </div>

    <div id="time-tunnel">
        <div class="tunnel-background">
            <div class="tunnel-bg-layer"></div>
            <div class="tunnel-bg-layer"></div>
            <div class="tunnel-bg-layer"></div>
        </div>
        
        <div class="time-river">
            <div class="time-line left"></div>
            <div class="time-line right"></div>
            
            <div class="time-card" id="time-card">
                <div class="time-card-header">
                    <span class="time-card-emoji">✨</span>
                    <span class="time-card-type">美好回忆</span>
                    <span class="time-card-date">2024/1/1</span>
                </div>
                <div class="time-card-content">这里显示日志内容</div>
                <div class="time-card-footer">在时间长河中，每一个瞬间都值得珍藏</div>
                <button class="time-card-delete" onclick="deleteCurrentOrb()">🗑</button>
            </div>
        </div>
        
        <div class="time-hint">点击任意位置返回</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="api.js"></script>
    <script src="script.js"></script>
</body>
</html>
